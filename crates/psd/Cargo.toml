[package]
name = "review-psd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# `cc` compiles the vendored psd_sdk C++ (`vendor/Psd/`) plus the C-ABI
# `src/wrapper.cpp` — the same source-plus-`cc` model as ufbx (`crates/import`) and
# meshoptimizer (`crates/optimize`), so a clean checkout builds on any OS with a C++
# compiler. `src/bindings.rs` is committed and hand-kept against `src/wrapper.h`, so
# no bindgen or libclang runs here. See `vendor/NOTICE.txt`.
build = "build.rs"

[dependencies]
thiserror.workspace = true

[build-dependencies]
cc.workspace = true

[lints]
workspace = true
