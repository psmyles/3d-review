[package]
name = "review-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytemuck.workspace = true
glam.workspace = true
# Direct3D 11 / DXGI. The renderer talks to the GPU natively via the `windows`
# crate; all D3D11 `unsafe`/COM is confined to the `rhi` module (the second
# sanctioned exception to invariant 9). Shared by the runtime and the bake binary.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
half.workspace = true
image.workspace = true
# PSD source art is decoded through the prebuilt psd_sdk FFI crate (invariant 9's
# third sanctioned FFI site) — replaces the old bundled-ImageMagick shell-out.
review-psd.workspace = true
# zune is the fast JPEG decode path (see `texture.rs`); `image` stays primary for
# the other source formats.
zune-core.workspace = true
zune-image.workspace = true
# Used only by the offline `bake_ibl` tool (the `bake` feature), never linked into
# the shipping viewer: `intel_tex_2` BC6H-compresses the baked IBL cubes (it ships
# prebuilt ISPC kernels, so no ISPC/libclang toolchain is needed — just the MSVC
# `cc` the workspace already requires). The bake runs its IBL precompute passes on a
# headless Direct3D 11 device (the same `rhi` module the runtime uses), so it pulls
# in neither wgpu nor pollster — the whole workspace is Direct3D 11.
intel_tex_2 = { version = "0.5", optional = true }
review-model = { path = "../model" }
# The renderer's own `GpuError`, which replaced `windows::core::Error` in every
# `rhi` signature so the backend's error type stops at the module boundary.
thiserror.workspace = true
# Tracy profiler client — always compiled in, inert until the client is started
# (`--tracy`). Drives the hand-rolled D3D11 GPU timestamp-query profiler
# (`scene/gpu_profiler.rs`) + the first-frame CPU zones in the app/render structure.
tracy-client.workspace = true

[features]
# Compiles the offline IBL bake path (the `bake_ibl_assets` entry point + the
# `bake_ibl` binary + the `rhi::bake` D3D11 plumbing). Off for normal builds, so the
# shipping viewer carries the baked maps but neither the raw HDRs nor the precompute/
# readback code. Enable with `--features bake` to re-bake (needs a real GPU). The IBL
# precompute is HLSL now (`hlsl/ibl.hlsl`), validated by `fxc` at build time
# (`build.rs`), so there is no longer a naga shader-validation dev-dependency.
bake = ["dep:intel_tex_2"]

# The offline IBL bake tool. Dev-only (needs a real GPU); guarded by the `bake`
# feature so `--all-targets` builds skip it unless the feature is on.
[[bin]]
name = "bake_ibl"
path = "src/bin/bake_ibl.rs"
required-features = ["bake"]

[lints]
workspace = true
