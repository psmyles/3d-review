[package]
name = "review-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytemuck.workspace = true
glam.workspace = true
# Direct3D 11 / DXGI. The renderer talks to the GPU natively via the `windows`
# crate; all D3D11 `unsafe`/COM is confined to the `rhi` module (the second
# sanctioned exception to invariant 9). Shared by the runtime and the bake binary.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
half.workspace = true
image.workspace = true
# All three are used only by the offline `bake_ibl` tool (the `bake` feature), not
# linked into the shipping viewer: `wgpu` runs the IBL precompute passes; `pollster`
# blocks on its headless device/queue requests; `intel_tex_2` BC6H-compresses the
# baked IBL cubes (it ships prebuilt ISPC kernels, so no ISPC/libclang toolchain is
# needed — just the MSVC `cc` the workspace already requires). The runtime renderer
# is pure Direct3D 11 via `windows`, so wgpu/pollster are gone from a normal build.
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
intel_tex_2 = { version = "0.5", optional = true }
review-model = { path = "../model" }
# Tracy profiler client — always compiled in, inert until the client is started
# (`--tracy`). Drives the hand-rolled D3D11 GPU timestamp-query profiler
# (`scene/gpu_profiler.rs`) + the first-frame CPU zones in the app/render structure.
tracy-client.workspace = true

[features]
# Compiles the offline IBL bake path (the `precompute_maps` passes + the
# `bake_ibl_assets` entry point + the `bake_ibl` binary). Off for normal builds,
# so the shipping viewer carries the baked maps but neither the raw HDRs nor the
# precompute/readback code — and pulls in neither wgpu nor pollster. Enable with
# `--features bake` to re-bake.
bake = ["dep:wgpu", "dep:pollster", "dep:intel_tex_2"]

[dev-dependencies]
# Validate the hand-written IBL precompute WGSL (`ibl.wgsl`) at `cargo test` time;
# the real pipeline-creation check runs under the `bake` feature and needs a GPU.
# Pinned to wgpu 24's naga. (Phase 6 will port `ibl.wgsl` to HLSL and drop this.)
naga = { version = "24", features = ["wgsl-in"] }

# The offline IBL bake tool. Dev-only (needs a real GPU); guarded by the `bake`
# feature so `--all-targets` builds skip it unless the feature is on.
[[bin]]
name = "bake_ibl"
path = "src/bin/bake_ibl.rs"
required-features = ["bake"]
