[package]
name = "review-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytemuck.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
glam.workspace = true
half.workspace = true
image.workspace = true
# Both only used by the offline `bake_ibl` tool (the `bake` feature), not linked
# into the shipping viewer: `pollster` blocks on the headless device/queue
# requests; `intel_tex_2` BC6H-compresses the baked IBL cubes (it ships prebuilt
# ISPC kernels, so no ISPC/libclang toolchain is needed — just the MSVC `cc` the
# workspace already requires).
pollster = { workspace = true, optional = true }
intel_tex_2 = { version = "0.5", optional = true }
review-model = { path = "../model" }
# Only used by the `startup-trace`-gated `SceneResources::new_core` timing
# breakdown (the crate's sole `tracing` call), so it's optional and off by
# default — a normal build carries no startup instrumentation.
tracing = { workspace = true, optional = true }
wgpu.workspace = true

[features]
# Compiles the offline IBL bake path (the `precompute_maps` passes + the
# `bake_ibl_assets` entry point + the `bake_ibl` binary). Off for normal builds,
# so the shipping viewer carries the baked maps but neither the raw HDRs nor the
# precompute/readback code. Enable with `--features bake` to re-bake.
bake = ["dep:pollster", "dep:intel_tex_2"]

# Dev-only startup profiling. Gates the `SceneResources::new_core` first-frame
# timing breakdown (the crate's only `tracing` use); enabled transitively by
# `review-app`'s `startup-trace` feature. Off for normal builds.
startup-trace = ["dep:tracing"]

[dev-dependencies]
# Validate the hand-written WGSL (scene shader) at `cargo test` time, since the
# real pipeline-creation check needs a GPU. Pinned to wgpu 24's naga.
naga = { version = "24", features = ["wgsl-in"] }

# The offline IBL bake tool. Dev-only (needs a real GPU); guarded by the `bake`
# feature so `--all-targets` builds skip it unless the feature is on.
[[bin]]
name = "bake_ibl"
path = "src/bin/bake_ibl.rs"
required-features = ["bake"]
