[package]
name = "review-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytemuck.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
glam.workspace = true
half.workspace = true
image.workspace = true
review-model = { path = "../model" }
wgpu.workspace = true

[dev-dependencies]
# Validate the hand-written WGSL (scene shader) at `cargo test` time, since the
# real pipeline-creation check needs a GPU. Pinned to wgpu 24's naga.
naga = { version = "24", features = ["wgsl-in"] }
