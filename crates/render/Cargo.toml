[package]
name = "review-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytemuck.workspace = true
# egui's paint types (`epaint::ClippedPrimitive` / `TexturesDelta`), consumed by our
# own sokol_gfx egui renderer (`src/egui_sokol.rs`, `mac-port-plan.md` D3). `render`
# *draws* the chrome; it never builds any — invariant 2 is unaffected, this is a
# paint-data dependency, not a UI one.
egui.workspace = true
glam.workspace = true
half.workspace = true
image.workspace = true
# PSD source art is decoded through the vendored psd_sdk FFI crate (invariant 9's
# third sanctioned FFI site) — replaces the old bundled-ImageMagick shell-out.
review-psd.workspace = true
# zune is the fast JPEG decode path (see `texture.rs`); `image` stays primary for
# the other source formats.
zune-core.workspace = true
zune-image.workspace = true
review-model = { path = "../model" }
# sokol_gfx — the one drawing API on both OSes (`mac-port-plan.md` D1). Every GPU
# call the renderer makes goes through it; the only platform code left is the
# device + swapchain leaf in `rhi/backend/`.
sokol.workspace = true
# The renderer's own `GpuError`, which replaced `windows::core::Error` in every
# `rhi` signature so the backend's error type stops at the module boundary.
thiserror.workspace = true
# Tracy profiler client — always compiled in, inert until the client is started
# (`--tracy`). Drives the GPU timestamp-query profiler (`rhi/gpu_profiler.rs`) + the
# first-frame CPU zones in the app/render structure.
tracy-client.workspace = true
# `Gpu::attach` reads the window's raw handle itself, so `app` hands over a
# `&Window` and needs no platform window-handle types (`mac-port-plan.md` §3.1).
winit.workspace = true

# Direct3D 11 / DXGI, for the Windows device + swapchain leaf (`rhi/backend/d3d11.rs`):
# the ~200 lines that create a device, hand it to `sg_setup`, and hand sokol_gfx a
# render-target view per frame. That leaf is invariant 9's sanctioned GPU site; the
# macOS twin takes the objc2 family here instead. Windows-only now — nothing above
# `rhi/backend` names it, and `app` no longer depends on `windows` at all.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

# The `CAMetalLayer` sokol_gfx draws through (`rhi/backend/metal.rs`) — the twin of
# the `windows` block above, and the only place on macOS that names Metal or Core
# Animation. Versions match winit's own objc2 family, so none of this is an extra
# compile.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = [
    "NSView",                        # setLayer:/setWantsLayer: on winit's view
    "NSResponder",                   # NSView's superclass chain
    "objc2-quartz-core",             # setLayer: takes a CALayer, so NSView needs the type
] }
objc2-foundation = { workspace = true, features = [
    "NSGeometry",                    # CGSize, for the layer's drawableSize
    "NSString",                      # the device's name, for the About box
] }
objc2-metal = { workspace = true, features = [
    "MTLDevice",                     # MTLCreateSystemDefaultDevice, the device sokol runs on
    "MTLPixelFormat",                # the layer's BGRA8Unorm backbuffer format
    "MTLDrawable",                   # CAMetalDrawable's base protocol
    "MTLTexture",                    # the drawable's texture, and the bake's readback source
    "MTLResource",
    "MTLCommandQueue",               # sokol's queue: the timing sentinels and the bake's blit
    "MTLCommandBuffer",              # ...the buffers on it, and their GPUEndTime
    "MTLCommandEncoder",             # endEncoding
    "MTLBlitCommandEncoder",         # the bake's texture -> buffer copy
    "MTLBuffer",                     # ...its shared-storage destination
    "MTLTypes",                      # MTLOrigin / MTLSize
] }
objc2-quartz-core = { workspace = true, features = [
    "CALayer",                       # contentsScale, the layer the view hosts
    "CAMetalLayer",                  # the layer itself: device, format, nextDrawable
    "objc2-metal",                   # enables CAMetalLayer's MTLDevice-typed accessors
] }

# BC6H block compression for the offline IBL bake (Intel ISPC kernels, prebuilt).
# Bake-only: it trades offline encode time for an ~8x smaller, sample-bandwidth-cheaper
# runtime map, and never ships in the viewer.
[dependencies.intel_tex_2]
version = "0.5"
optional = true

[build-dependencies]
# The shader-bytecode manifest keys freshness on file content rather than on
# mtimes, which stop meaning anything the moment two hosts commit blobs (D5).
sha2.workspace = true

[features]
# The offline IBL precompute (`mac-port-plan.md` D19): the bake half of `src/ibl.rs`,
# the headless device + render targets in `src/rhi/bake.rs`, the readback leaf in the
# backend, and the `bake_ibl` binary. Off by default — a normal build compiles none of
# it, and the viewer embeds the committed baked maps instead.
bake = ["dep:intel_tex_2"]

[[bin]]
name = "bake_ibl"
path = "src/bin/bake_ibl.rs"
required-features = ["bake"]

[lints]
workspace = true
