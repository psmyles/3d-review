[package]
name = "review-snapshot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Headless renders of models, LOD chains and Opt stacks through the viewer's own renderer"
publish = false

# A developer tool, not part of the shipped viewer: it renders through the real
# `Renderer` on a windowless GPU (`review-render`'s `headless` feature), so its
# images are the viewer's frames, and it never opens a window or takes input.
[dependencies]
anyhow.workspace = true
glam.workspace = true
image.workspace = true
review-import = { path = "../import" }
review-model = { path = "../model" }
review-optimize = { path = "../optimize" }
review-render = { path = "../render", features = ["headless"] }
# Labels on the contact sheets. Already in the graph through egui's text stack,
# so this adds no crate to the build.
ab_glyph = "0.2"

[lints]
workspace = true
