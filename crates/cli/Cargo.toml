[package]
name = "review-cli"
# The version `--version` prints and every report records is the product's, read
# from `product.json` by build.rs - this field is cargo's and nobody reads it.
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Optimize and check FBX models from a terminal, a script or Launcher, without the viewer"
publish = false

# The Opt and Aud workspaces' work as a console program, shipped beside the
# viewer. Everything it does is a library call the viewer makes too - import,
# the operation stack, the export, the audit - so it links no GPU, no window and
# no egui, and a run measures exactly what the viewer would.
[[bin]]
name = "3d-review-cli"
path = "src/main.rs"

[dependencies]
# `--rules`, `--results`, `--staged` and the `rules` command: Asset Check's
# resolution, results format, git helpers and cache.
asset-rules.workspace = true
review-audit = { path = "../audit" }
review-import = { path = "../import" }
review-labels.workspace = true
review-localization.workspace = true
review-model = { path = "../model" }
review-optimize = { path = "../optimize" }
# `float_roundtrip`: a `--staged` run's cache stores each model's findings as
# JSON and reads them back into the next run's results, and serde_json's default
# float parser can land one unit in the last place away - so a cached run's
# figures differed from the fresh run's in their last digit.
serde_json = { workspace = true, features = ["float_roundtrip"] }
# The digest `--results` records for a built-in `--profile`, as `sha256:<hex>`
# like the one `asset-rules` records for a rules file. The version `asset-rules`
# links, not the workspace's 0.10 (which only build scripts use), so the binary
# carries one SHA-256 rather than two; default features add nothing hashing
# needs.
sha2 = { version = "0.11", default-features = false }
# The OS locale, for the catalog - as the viewer picks it.
sys-locale.workspace = true

[build-dependencies]
# Generates `keys.rs` (the typed message keys of `cli.ftl`) into this crate's
# OUT_DIR.
review-localization-build.workspace = true
# Reads the product version out of `product.json`.
serde_json.workspace = true

[lints]
workspace = true
