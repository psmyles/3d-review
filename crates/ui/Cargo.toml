[package]
name = "review-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
egui.workspace = true
# The in-app manual: the same markdown `docs/book/` publishes, rendered with
# egui's own widgets. See the workspace manifest for why only `load-images`.
egui_commonmark.workspace = true
glam.workspace = true
image.workspace = true
# The notices write every card they raise to the log as well.
log.workspace = true
# The Log window's `Entry` / `Level`, which `app` hands over as plain values.
review-log.workspace = true
review-model = { path = "../model" }
# The Opt workspace edits an `OptStack` and displays its measured metrics, so the
# chrome needs those types. Commands still flow ui -> app (invariant 2): this
# crate reads and edits the stack value, never runs an operation.
review-optimize = { path = "../optimize" }
# `Key` and `tr`; the `egui` feature is what lets a key be handed straight to a
# widget as an `impl Into<WidgetText>`.
review-localization = { workspace = true, features = ["egui"] }
# The shared guarded Tracy helpers, for the per-frame UI CPU zones (Draw Viewport
# Scene / Draw Overlay); carries `tracy-client` itself, so this crate needs no
# direct dependency on it.
review-prof.workspace = true
review-render = { path = "../render" }

[build-dependencies]
# Generates `keys.rs` (the typed message keys) into this crate's OUT_DIR.
review-localization-build.workspace = true
# Records where each manual page's images and intra-book links sit, so the Help
# window resolves them without parsing markdown per frame.
pulldown-cmark.workspace = true

[lints]
workspace = true
