[package]
name = "review-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
egui.workspace = true
egui-notify.workspace = true
glam.workspace = true
image.workspace = true
review-model = { path = "../model" }
# The Opt workspace edits an `OptStack` and displays its measured metrics, so the
# chrome needs those types. Commands still flow ui -> app (invariant 2): this
# crate reads and edits the stack value, never runs an operation.
review-optimize = { path = "../optimize" }
review-render = { path = "../render" }
# Tracy profiler client — always compiled in, inert until started (`--tracy`).
# Used for the per-frame UI CPU zones (Draw Viewport Scene / Draw Overlay).
tracy-client.workspace = true
