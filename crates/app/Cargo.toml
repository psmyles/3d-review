[package]
name = "review-app"
version = "0.1.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
egui.workspace = true
egui-directx11.workspace = true
egui-winit.workspace = true
glam.workspace = true
image.workspace = true
notify.workspace = true
pollster.workspace = true
review-import = { path = "../import" }
review-model = { path = "../model" }
review-render = { path = "../render" }
review-ui = { path = "../ui" }
rfd.workspace = true
tracy-client.workspace = true
wgpu.workspace = true
winit.workspace = true
# Direct3D 11 / DXGI for the device + swapchain bootstrap and first-frame present
# (the startup black-fill, replacing the old GDI hack). Scoped to the window/
# swapchain setup; the renderer's D3D11 lives in `review-render`'s `rhi` module.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[target.'cfg(windows)'.build-dependencies]
serde_json.workspace = true
winresource.workspace = true

[[bin]]
name = "3d-review"
path = "src/main.rs"
