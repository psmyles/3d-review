[package]
name = "review-app"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
egui.workspace = true
egui-directx11.workspace = true
egui-winit.workspace = true
glam.workspace = true
image.workspace = true
notify.workspace = true
review-import = { path = "../import" }
review-model = { path = "../model" }
# The Opt workspace's mesh processing (vendored meshoptimizer behind a safe API).
review-optimize = { path = "../optimize" }
# The shared guarded Tracy helpers (zones, plots, frame marks, messages).
review-prof.workspace = true
review-render = { path = "../render" }
review-ui = { path = "../ui" }
rfd.workspace = true
tracy-client.workspace = true
winit.workspace = true
# Only `HWND` (handed to `review-render`'s safe `Gpu::new`) — all D3D11/DXGI COM
# lives in `review-render`'s `rhi` module now (invariant 9); `app` itself has
# zero `unsafe`.
windows = { workspace = true, features = ["Win32_Foundation"] }

[target.'cfg(windows)'.build-dependencies]
serde_json.workspace = true
winresource.workspace = true

[[bin]]
name = "3d-review"
path = "src/main.rs"

[lints]
workspace = true
