[package]
name = "review-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
egui.workspace = true
egui-wgpu = { workspace = true, features = ["winit"] }
egui-winit.workspace = true
glam.workspace = true
image.workspace = true
notify.workspace = true
pollster.workspace = true
review-import = { path = "../import" }
review-model = { path = "../model" }
review-render = { path = "../render" }
review-ui = { path = "../ui" }
rfd.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu.workspace = true
winit.workspace = true

[target.'cfg(windows)'.dependencies]
# GDI used only by `startup_paint` to fill the new window black before the first
# wgpu present (the one sanctioned exception to invariant 9).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
serde_json.workspace = true
winresource.workspace = true

[[bin]]
name = "3d-review"
path = "src/main.rs"
