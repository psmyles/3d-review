[package]
name = "review-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
egui.workspace = true
egui-wgpu = { workspace = true, features = ["winit"] }
egui-winit.workspace = true
glam.workspace = true
image.workspace = true
notify.workspace = true
pollster.workspace = true
# Off by default. The `startup-trace` feature flips `profiling`'s tracing backend
# on for the whole graph, turning egui-wgpu's + wgpu's `profiling::scope!`
# annotations (RenderState::create / request_device / configure_surface / …) into
# INFO tracing spans so the otherwise-opaque `set_window` startup cost can be
# broken down. See the `startup-trace` feature + `startup_timing`.
profiling = { workspace = true, optional = true }
review-import = { path = "../import" }
review-model = { path = "../model" }
review-render = { path = "../render" }
review-ui = { path = "../ui" }
rfd.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu.workspace = true
winit.workspace = true

[target.'cfg(windows)'.dependencies]
# GDI used only by `startup_paint` to fill the new window black before the first
# wgpu present (the one sanctioned exception to invariant 9).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
serde_json.workspace = true
winresource.workspace = true

[features]
# Dev-only startup profiling — the single switch for ALL startup instrumentation
# (off in shipping builds, so a default release carries none). It (1) compiles in
# the `StartupTimer` phase laps + `review-render`'s `SceneResources::new_core`
# breakdown (both absent/no-op without it), and (2) enables `profiling`'s tracing
# backend across the graph (egui-wgpu, wgpu), so their internal `profiling::scope!`
# spans surface as INFO tracing events that `main` logs at CLOSE — breaking down
# the otherwise-opaque `set_window` (adapter/device/surface) cost. Build with
# `--features startup-trace` and run with `RUST_LOG=info` to see it all.
startup-trace = ["dep:profiling", "profiling/profile-with-tracing", "review-render/startup-trace"]

[[bin]]
name = "3d-review"
path = "src/main.rs"
