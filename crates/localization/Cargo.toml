[package]
name = "review-localization"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# `Key` converts straight into an `egui::WidgetText` / `RichText`, which is what
# lets every widget wrapper take `impl Into<WidgetText>` and accept a key, a typed
# formatter's `String`, or a runtime value alike. Off by default so `app` and
# `shell-macos` — neither of which draws egui text — link no egui.
egui = ["dep:egui"]

[dependencies]
egui = { workspace = true, optional = true }
fluent-bundle.workspace = true
fluent-langneg.workspace = true
unic-langid.workspace = true

[build-dependencies]
review-localization-build.workspace = true

[dev-dependencies]
proc-macro2.workspace = true
# Reading an attribute back as tokens, to spot a `#[cfg(test)]` module. Already
# in the graph beside `syn`, which every derive macro pulls it in with.
quote = "1"
syn.workspace = true

[lints]
workspace = true
