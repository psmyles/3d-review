[package]
name = "review-import"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
glam.workspace = true
review-model = { path = "../model" }
thiserror.workspace = true
# Tracy profiler client — always compiled in, inert until started (`--tracy`).
# Used for the FBX-import CPU zones (Load FBX / Build ModelData); the C-side ufbx
# parse stays un-instrumented.
tracy-client.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cc.workspace = true
