[package]
name = "review-import"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
glam.workspace = true
review-model = { path = "../model" }
# The shared guarded Tracy helpers, for the FBX-import CPU zones (Load FBX /
# Build ModelData); the C-side ufbx parse stays un-instrumented.
review-prof.workspace = true
thiserror.workspace = true
# Tracy profiler client — always compiled in, inert until started (`--tracy`).
# Needed directly (beyond `review-prof`) for `tracy_alloc`'s allocation hooks,
# which call into `tracy_client::sys` rather than through a zone macro.
tracy-client.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    # `STARTUPINFOW` (used by `startup_show_maximized`) lives behind this feature;
    # declare it explicitly so the crate builds/tests standalone, not only when
    # another workspace member happens to enable it via feature unification.
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cc.workspace = true

[lints]
workspace = true
