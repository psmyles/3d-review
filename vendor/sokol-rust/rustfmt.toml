#
# NOTE: For info about what these do see https://rust-lang.github.io/rustfmt/
#

# --- LOCAL MODIFICATION (3D Review) --------------------------------------------
# This tree is a pinned upstream checkout and must stay byte-identical to it, but
# `cargo fmt --all` reaches it anyway: it follows path dependencies, and the
# workspace `exclude` only keeps it out of the *build* graph, not out of fmt. It
# then formats these files with the settings below minus everything nightly-only,
# which is nobody's style, and every reformatted line becomes a conflict the next
# time the pin moves.
#
# rustfmt reads the nearest rustfmt.toml above each file, so switching it off here
# is what actually stops that — the stable `ignore` option is nightly-only, and a
# root-level setting would not reach these files. The only line below this comment
# is ours; the rest is upstream's, kept so the setting is easy to drop when
# re-vendoring. See vendor/NOTICE.txt.
disable_all_formatting = true
# -------------------------------------------------------------------------------

group_imports = "StdExternalCrate"
match_block_trailing_comma = true
use_field_init_shorthand = true
normalize_doc_attributes = true
overflow_delimited_expr = true
imports_granularity = "Crate"
use_small_heuristics = "Max"
reorder_impl_items = true
use_try_shorthand = true
newline_style = "Unix"
wrap_comments = true
version = "Two"

short_array_element_width_threshold = 20
single_line_if_else_max_width = 80
struct_lit_width = 80
comment_width = 110
max_width = 110
