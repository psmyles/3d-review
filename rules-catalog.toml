# 3D Review's rules catalog: every check review3d-cli runs, with its texts, settings and the
# defaults of each engine's built-in set. Format: "The catalog file (format 1)" in
# SandboxVR/exp-content-rules, docs/rule-editor-plan.md.
#
# Draft, generated from crates/audit (rule table, parameter specs, built-in defaults) and
# crates/localization/locales/en/labels-audit.ftl. The code doesn't read it yet.

catalog = 1
tool = "review3d-cli"
bases = ["unity", "unreal", "generic"]

[[category]]
id = "geometry"
title = "Geometry"

[[category]]
id = "transforms"
title = "Transforms"

[[category]]
id = "uv"
title = "UVs"

[[category]]
id = "skin"
title = "Skin"

[[category]]
id = "density"
title = "Density"

[[category]]
id = "naming"
title = "Naming"

[[category]]
id = "hierarchy"
title = "Hierarchy"

[[rule]]
id = "geometry.degenerate_triangles"
category = "geometry"
since = "0.9.0"
title = "Degenerate triangles"
what = "Triangles with no area: their corners sit on one point or on one line."
why = "They draw nothing but still cost a GPU time, and they can break normals, tangents and lightmap baking."
how = "Merge the collapsed corners, or delete the faces with your modelling program's mesh clean-up tool."

[rule.default]
enabled = true
severity = "warning"

[rule.app]
element = "triangle"
marker = "dot"
view = "issues"

[[rule]]
id = "geometry.non_manifold_edges"
category = "geometry"
since = "0.9.0"
title = "Non-manifold edges"
what = "Edges shared by more than two faces, like a fin standing on a surface."
why = "Smoothing, simplifying and baking all assume each edge has one face on each side. A non-manifold edge can shade wrongly and stops many tools working on the mesh."
how = "Separate the extra face from the edge, or delete it."

[rule.default]
enabled = true
severity = "warning"

[rule.app]
element = "edge"
marker = "edge"
view = "issues"

[[rule]]
id = "geometry.isolated_vertices"
category = "geometry"
since = "0.9.0"
title = "Loose points"
what = "Points that no face uses."
why = "They are invisible but still stored, and they make the bounding box and the pivot wrong."
how = "Delete loose vertices with your modelling program's clean-up tool."

[rule.default]
enabled = true
severity = "info"

[rule.app]
element = "vertex"
marker = "dot"
view = "issues"

[[rule]]
id = "geometry.duplicate_vertices"
category = "geometry"
since = "0.9.0"
title = "Unwelded points"
what = "Separate points in one part that sit at the same place."
why = "The surface looks joined but is not: it can split open when it bends, shade with a seam, and leak light in a lightmap."
how = "Merge vertices by distance."

[rule.default]
enabled = true
severity = "warning"
[rule.base.generic]
severity = "info"

[[rule.param]]
key = "tolerance"
kind = "number"
unit = "m"
min = 0.0
max = 0.01
default = 1e-5
label = "Tolerance"
help = "How far a value may be from what the check expects before it counts."

[rule.app]
element = "vertex"
marker = "dot"
view = "issues"

[[rule]]
id = "geometry.ngons"
category = "geometry"
since = "0.9.0"
title = "N-gons"
what = "Faces with more than four corners."
why = "Every engine triangulates them on import its own way, which can differ from how your modelling program showed them and bend shading or a bake."
how = "Cut them into quads and triangles yourself, or triangulate the mesh before export."

[rule.default]
enabled = true
severity = "warning"
[rule.base.unity]
why = "Unity triangulates them on import its own way, which can differ from how your modelling program showed them and bend shading or a bake."
[rule.base.unreal]
why = "Unreal triangulates them on import its own way, which can differ from how your modelling program showed them and bend shading or a bake."
[rule.base.generic]
severity = "info"

[rule.app]
element = "triangle"
marker = "fill"
view = "issues"

[[rule]]
id = "geometry.missing_normals"
category = "geometry"
since = "0.9.0"
title = "Missing normals"
what = "Parts whose file carries no normals; the viewer worked them out."
why = "The engine will calculate its own, so the shading you see in the game is not the shading you authored."
how = "Turn on normals in your FBX export settings."

[rule.default]
enabled = true
severity = "info"
[rule.base.unity]
why = "Unity will calculate its own, so the shading you see in the game is not the shading you authored."
[rule.base.unreal]
severity = "warning"
why = "Unreal will calculate its own, so the shading you see in the game is not the shading you authored."

[rule.app]
element = "node"
marker = "object"
view = "issues"

[[rule]]
id = "geometry.missing_tangents"
category = "geometry"
since = "0.9.0"
title = "Missing tangents"
what = "Parts whose file carries no tangents."
why = "A normal map is applied through the tangents. If the engine builds different ones from the baker, the normal map shows seams and wrong lighting."
how = "Export tangents and binormals, using the same tangent space your baker used."

[rule.default]
enabled = true
severity = "info"
[rule.base.generic]
enabled = false

[rule.app]
element = "node"
marker = "object"
view = "issues"

[[rule]]
id = "geometry.inverted_normals"
category = "geometry"
since = "0.9.0"
title = "Inside-out faces"
what = "Faces whose normals point the opposite way to how they are wound."
why = "The face is drawn from the wrong side: it disappears, or lights as if from behind."
how = "Flip these faces, or conform the normals of the part."

[rule.default]
enabled = true
severity = "error"
[rule.base.generic]
severity = "warning"

[rule.app]
element = "triangle"
marker = "fill"
view = "issues"

[[rule]]
id = "geometry.hard_edges"
category = "geometry"
since = "0.9.0"
title = "Mostly hard edges"
what = "Parts where most edges are hard (the faces on each side shade separately)."
why = "Every hard edge doubles the points along it on the GPU, so a part that is mostly hard edges is mostly duplicate points. Faceted shading is often a sign normals were lost."
how = "Soften the edges that are not meant to be sharp, or set smoothing groups by angle."

[rule.default]
enabled = true
severity = "info"

[[rule.param]]
key = "max_ratio"
kind = "number"
min = 0.0
max = 1.0
default = 0.5
label = "Most hard edges"
help = "The share of a part's edges that may be hard before it is reported."

[rule.app]
element = "edge"
marker = "edge"
view = "issues"

[[rule]]
id = "geometry.triangle_budget"
category = "geometry"
since = "0.9.0"
title = "Triangle budget"
what = "Parts, or the whole file, with more triangles than the profile allows."
why = "Triangles cost memory and draw time on every frame the asset is seen."
how = "Reduce the mesh, or split detail into LODs. The Opt workspace can do both."

[rule.default]
enabled = true
severity = "warning"
[rule.base.generic]
severity = "info"

[[rule.param]]
key = "max_per_object"
kind = "count"
min = 1
max = 1000000000
default = 200000
label = "Per part"
help = "The most triangles one part may have."

[[rule.param]]
key = "max_total"
kind = "count"
min = 1
max = 1000000000
default = 2000000
label = "Whole file"
help = "The most triangles the whole file may have."

[rule.app]
element = "node"
marker = "object"
view = "triangle_density"
see_also = "overdraw"

[[rule]]
id = "geometry.draw_call_budget"
category = "geometry"
since = "0.9.0"
title = "Draw calls"
what = "How many separate draws the file needs: one per part and material."
why = "Each draw has a fixed cost on the CPU, whatever its size, so many small pieces are slower than a few big ones."
how = "Merge parts that share a material, and share materials between parts."

[rule.default]
enabled = true
severity = "warning"
[rule.base.generic]
severity = "info"

[[rule.param]]
key = "max"
kind = "count"
min = 1
max = 100000
default = 32
label = "Maximum"
help = "The largest value that still passes."

[rule.app]
element = "scene"
marker = "object"
view = "issues"

[[rule]]
id = "transform.scale"
category = "transforms"
since = "0.9.0"
title = "Scaled objects"
what = "Objects whose scale is not 1."
why = "Engines treat object scale differently, so the asset can arrive at the wrong size or carry the scale into everything attached to it."
how = "Apply (freeze) the scale before export."

[rule.default]
enabled = true
severity = "info"
[rule.base.unity]
severity = "warning"
why = "Unity carries the scale onto the imported object, so physics, effects and anything attached inherit it."
[rule.base.unreal]
why = "Unreal bakes or carries the scale depending on import settings, so the same file can arrive at different sizes."

[rule.app]
element = "node"
marker = "object"
view = "issues"

[[rule]]
id = "transform.negative_scale"
category = "transforms"
since = "0.9.0"
title = "Mirrored objects"
what = "Objects flipped by a negative scale. Only the object where the flip starts is listed."
why = "A mirror turns the mesh inside out. Some engines correct it and some draw the faces from the wrong side."
how = "Apply the scale, then check the faces still point outwards."

[rule.default]
enabled = true
severity = "warning"

[rule.app]
element = "node"
marker = "object"
view = "issues"

[[rule]]
id = "transform.unfrozen"
category = "transforms"
since = "0.9.0"
title = "Unfrozen transforms"
what = "Meshes with a rotation, a geometric transform or an offset pivot left on them."
why = "The geometry is not where its object says it is, so snapping, pivots and collision behave unexpectedly in the engine."
how = "Freeze or apply the transforms and reset the pivot."

[rule.default]
enabled = true
severity = "info"
[rule.base.unity]
severity = "warning"

[rule.app]
element = "node"
marker = "object"
view = "issues"

[[rule]]
id = "transform.pivot_offset"
category = "transforms"
since = "0.9.0"
title = "Off-origin pivot"
what = "Top-level objects whose pivot is away from the world origin."
why = "The engine places the asset by its pivot, so it lands somewhere other than where it was dropped."
how = "Move the object back to the origin before export."

[rule.default]
enabled = true
severity = "info"
[rule.base.unreal]
severity = "warning"

[[rule.param]]
key = "max_distance"
kind = "number"
unit = "m"
min = 0.0
max = 10000.0
default = 0.01
label = "Farthest from origin"
help = "How far a top-level object's pivot may sit from the world origin."

[rule.app]
element = "node"
marker = "dot"
view = "issues"

[[rule]]
id = "scene.unit"
category = "transforms"
since = "0.9.0"
title = "Scene unit"
what = "Whether the file's unit matches the target engine's."
why = "A file in a different unit from the engine is scaled on import, which either changes its size or adds a scale to the object."
how = "Set the scene unit, or the export unit, to the engine's."

[rule.default]
enabled = true
severity = "info"
[rule.base.unity]
why = "Unity works in meters. A file in another unit is scaled on import, which either changes its size or adds a scale to the object."
[rule.base.unreal]
severity = "warning"
params = { target = 0.01 }
why = "Unreal works in centimeters. A file in another unit is scaled on import, which either changes its size or adds a scale to the object."
[rule.base.generic]
enabled = false

[[rule.param]]
key = "target"
kind = "number"
unit = "m"
min = 1e-6
max = 1e6
options = [
  { value = 1.0, label = "m" },
  { value = 0.01, label = "cm" },
  { value = 0.001, label = "mm" },
  { value = 0.0254, label = "in" },
  { value = 0.3048, label = "ft" },
  { value = 0.9144, label = "yd" },
]
default = 1.0
label = "Target"
help = "The unit files should be in, as meters per unit: 1 is meters, 0.01 is centimeters."

[rule.app]
element = "scene"
marker = "none"
view = "issues"

[[rule]]
id = "scene.up_axis"
category = "transforms"
since = "0.9.0"
title = "Up axis"
what = "Whether the file's up axis matches the target engine's."
why = "A file whose up axis differs from the engine's is rotated on import, which can leave a rotation on the root object."
how = "Export with the engine's up axis."

[rule.default]
enabled = true
severity = "info"
[rule.base.unity]
severity = "warning"
why = "Unity is Y-up. A Z-up file is rotated on import, which leaves a rotation on the root object."
[rule.base.unreal]
params = { target = "positive_z" }
why = "Unreal is Z-up. A Y-up file is rotated on import, which can leave a rotation on the root object."
[rule.base.generic]
enabled = false

[[rule.param]]
key = "target"
kind = "choice"
options = [
  { value = "positive_y", label = "+Y" },
  { value = "positive_z", label = "+Z" },
  { value = "positive_x", label = "+X" },
  { value = "negative_y", label = "-Y" },
  { value = "negative_z", label = "-Z" },
  { value = "negative_x", label = "-X" },
]
default = "positive_y"
label = "Target"
help = "The axis files should have pointing up: +Y for Unity, +Z for Unreal."

[rule.app]
element = "scene"
marker = "none"
view = "issues"

[[rule]]
id = "uv.missing"
category = "uv"
since = "0.9.0"
name = "UvMissing"
title = "Missing UVs"
what = "Parts with no UVs, without UVs in a set the other parts fill, or with their sets in a different order."
why = "Without UVs nothing can be textured. Parts with mismatched sets get the wrong UVs wherever they share a material or a lightmap."
how = "Unwrap the part, and give every part the same UV sets in the same order."

[rule.default]
enabled = true
severity = "error"
[rule.base.generic]
severity = "warning"

[rule.app]
element = "node"
marker = "object"
view = "issues"

[[rule]]
id = "uv.out_of_range"
category = "uv"
since = "0.9.0"
name = "UvOutOfRange"
title = "UVs outside 0-1"
what = "Faces whose UVs reach outside the 0 to 1 square."
why = "Fine for tiling textures, but for a unique texture or a bake those faces read pixels that belong to something else."
how = "If the texture is not meant to tile, pack these islands back into the square."

[rule.default]
enabled = true
severity = "info"

[rule.app]
element = "triangle"
marker = "fill"
view = "issues"

[[rule]]
id = "uv.overlap"
category = "uv"
since = "0.9.0"
name = "UvOverlap"
title = "Overlapping UVs"
what = "Faces of one material that share texture space."
why = "Overlaps share pixels, which is fine for mirrored or stacked parts but breaks texture painting and baking, where each face needs its own."
how = "If the overlap is not deliberate, move the islands apart."

[rule.default]
enabled = true
severity = "info"

[[rule.param]]
key = "resolution"
kind = "count"
unit = "px"
min = 16
max = 4096
default = 1024
label = "Raster size"
help = "The texture size the UV layout is checked at, in pixels. Bigger is more exact and slower."

[rule.app]
element = "triangle"
marker = "fill"
view = "issues"

[[rule]]
id = "uv.flipped"
category = "uv"
since = "0.9.0"
name = "UvFlipped"
title = "Flipped UVs"
what = "UV islands that are mirrored, and faces folded over inside their island."
why = "Mirroring is a normal way to save texture space, but a normal map on a mirrored island needs tangents that agree with it, and a fold always shows as a seam."
how = "Flip the island back, unless it is mirrored on purpose; unfold folded faces."

[rule.default]
enabled = true
severity = "info"

[rule.app]
element = "triangle"
marker = "fill"
view = "issues"

[[rule]]
id = "uv.lightmap_missing"
category = "uv"
since = "0.9.0"
title = "Missing lightmap UVs"
what = "Parts without the UV set the profile uses for lightmaps."
why = "Baked lighting needs its own UV set with no overlaps; without one the engine has to generate it."
how = "Add a second UV set laid out for lightmaps."

[rule.default]
enabled = true
severity = "info"
[rule.base.unity]
why = "Unity can generate lightmap UVs on import, but hand-made ones pack better and bleed less."
[rule.base.unreal]
why = "Unreal generates lightmap UVs if there are none, but hand-made ones pack better and bleed less."
[rule.base.generic]
enabled = false

[[rule.param]]
key = "channel"
kind = "count"
min = 0
max = 7
default = 1
label = "UV set"
help = "Which UV set holds the lightmap UVs, counting from 0."

[rule.app]
element = "node"
marker = "object"
view = "issues"

[[rule]]
id = "uv.lightmap_overlap"
category = "uv"
since = "0.9.0"
title = "Overlapping lightmap UVs"
what = "Faces of one part that share lightmap pixels."
why = "Each pixel of a lightmap stores the light for one place. Faces that share one get the same light, which shows as dark or bright patches."
how = "Unwrap the lightmap UVs again so no two faces overlap."

[rule.default]
enabled = true
severity = "warning"
[rule.base.unreal]
severity = "error"
params = { resolution = 64 }

[[rule.param]]
key = "channel"
kind = "count"
min = 0
max = 7
default = 1
label = "UV set"
help = "Which UV set holds the lightmap UVs, counting from 0."

[[rule.param]]
key = "resolution"
kind = "count"
unit = "px"
min = 16
max = 4096
default = 128
label = "Raster size"
help = "The texture size the UV layout is checked at, in pixels. Bigger is more exact and slower."

[rule.app]
element = "triangle"
marker = "fill"
view = "issues"

[[rule]]
id = "uv.lightmap_padding"
category = "uv"
since = "0.9.0"
title = "Lightmap padding"
what = "Islands closer together than the padding, at the lightmap's resolution, in the UV set the profile names - the second one by default, where engines expect the lightmap."
why = "Light bleeds from one island into its neighbour when the lightmap is filtered or shrunk, which shows as light leaks along edges."
how = "Pack the lightmap UVs again with more spacing."

[rule.default]
enabled = true
severity = "warning"
[rule.base.unreal]
params = { resolution = 64 }
[rule.base.generic]
enabled = false
severity = "info"

[[rule.param]]
key = "channel"
kind = "count"
min = 0
max = 7
default = 1
label = "UV set"
help = "Which UV set holds the lightmap UVs, counting from 0."

[[rule.param]]
key = "resolution"
kind = "count"
unit = "px"
min = 16
max = 4096
default = 128
label = "Raster size"
help = "The texture size the UV layout is checked at, in pixels. Bigger is more exact and slower."

[[rule.param]]
key = "min_padding"
kind = "count"
unit = "px"
min = 0
max = 64
default = 2
label = "Padding"
help = "The smallest gap, in pixels at the raster size, allowed between two islands."

[rule.app]
element = "triangle"
marker = "fill"
view = "issues"

[[rule]]
id = "uv.lightmap_out_of_range"
category = "uv"
since = "0.9.0"
title = "Lightmap UVs outside 0-1"
what = "Faces whose lightmap UVs reach outside the 0 to 1 square."
why = "A lightmap never tiles, so those faces read light that belongs to another face."
how = "Pack the lightmap UVs inside the square."

[rule.default]
enabled = true
severity = "error"
[rule.base.generic]
severity = "warning"

[[rule.param]]
key = "channel"
kind = "count"
min = 0
max = 7
default = 1
label = "UV set"
help = "Which UV set holds the lightmap UVs, counting from 0."

[rule.app]
element = "triangle"
marker = "fill"
view = "issues"

[[rule]]
id = "skin.influences"
category = "skin"
since = "0.9.0"
title = "Too many bone influences"
what = "Points moved by more bones than the profile allows."
why = "Engines keep a fixed number of bones per point and drop the lightest ones, so the mesh bends differently in the game."
how = "Limit the influences per vertex to the engine's number and normalize the weights."

[rule.default]
enabled = true
severity = "warning"
[rule.base.unity]
why = "Unity keeps 4 bones per point by default and drops the lightest ones, so the mesh bends differently in the game."
[rule.base.unreal]
why = "Unreal keeps 8 bones per point by default and drops the lightest ones, so the mesh bends differently in the game."
[rule.base.generic]
severity = "info"

[[rule.param]]
key = "max"
kind = "count"
min = 1
max = 64
default = 4
label = "Maximum"
help = "The largest value that still passes."

[rule.app]
element = "vertex"
marker = "dot"
view = "issues"

[[rule]]
id = "skin.unnormalized_weights"
category = "skin"
since = "0.9.0"
title = "Unnormalized weights"
what = "Points whose bone weights do not add up to 1."
why = "The viewer, like most engines, quietly rescales them, so the bend you see is not the weights you painted."
how = "Normalize the skin weights."

[rule.default]
enabled = true
severity = "info"

[[rule.param]]
key = "tolerance"
kind = "number"
min = 0.0
max = 1.0
default = 0.01
label = "Tolerance"
help = "How far a value may be from what the check expects before it counts."

[rule.app]
element = "vertex"
marker = "dot"
view = "issues"

[[rule]]
id = "skin.bones_per_mesh"
category = "skin"
since = "0.9.0"
title = "Bones per mesh"
what = "Skinned parts moved by more bones than the profile allows."
why = "Some platforms limit how many bones one draw can use, so a mesh over the limit is split into more draws."
how = "Split the mesh, or move weights onto fewer bones."

[rule.default]
enabled = true
severity = "info"
[rule.base.unreal]
why = "On mobile, Unreal splits a mesh into sections of 75 bones or fewer, which costs extra draws."

[[rule.param]]
key = "max"
kind = "count"
min = 1
max = 4096
default = 80
label = "Maximum"
help = "The largest value that still passes."

[rule.app]
element = "node"
marker = "object"
view = "issues"

[[rule]]
id = "skin.unused_bones"
category = "skin"
since = "0.9.0"
title = "Unused bones"
what = "Bones that move nothing: no weights on them or on any bone below them."
why = "The engine still updates them every frame. End joints are often left in by accident."
how = "Delete the bones you do not need, unless they are sockets or used by animation."

[rule.default]
enabled = true
severity = "info"

[rule.app]
element = "node"
marker = "dot"
view = "issues"

[[rule]]
id = "skin.bind_pose_mismatch"
category = "skin"
since = "0.9.0"
title = "Bind pose differs from the rest pose"
what = "Bones whose bind pose (where the mesh was skinned) is not where the skeleton stands."
why = "Engines that rebuild the bind pose from the skeleton deform the mesh on import, or drift it as soon as an animation plays."
how = "Return the skeleton to its bind pose, or re-bind the skin, before export."

[rule.default]
enabled = true
severity = "info"
[rule.base.unreal]
severity = "warning"

[rule.app]
element = "node"
marker = "dot"
view = "issues"

[[rule]]
id = "density.texel"
category = "density"
since = "0.9.0"
name = "TexelDensity"
title = "Texel density"
what = "Parts whose texture pixels per meter are far from the profile's target, for the texture size it names."
why = "Parts sharpen or blur next to each other when their texel density differs, which reads as an inconsistent asset."
how = "Scale the part's UV islands towards the target density."

[rule.default]
enabled = true
severity = "warning"
[rule.base.generic]
severity = "info"

[[rule.param]]
key = "texture_size"
kind = "count"
unit = "px"
min = 16
max = 16384
default = 1024
label = "Texture size"
help = "The size of the texture the density is worked out for, in pixels."

[[rule.param]]
key = "target"
kind = "number"
unit = "px/m"
min = 1.0
max = 100000.0
default = 1024.0
label = "Target"
help = "The density each part should be close to, in texture pixels per meter at the texture size above."

[[rule.param]]
key = "tolerance"
kind = "number"
min = 1.0
max = 16.0
default = 2.0
label = "Tolerance"
help = "How far a value may be from what the check expects before it counts."

[rule.app]
element = "node"
marker = "object"
view = "texel_density"

[[rule]]
id = "density.triangle_lod"
category = "density"
since = "0.9.0"
title = "Needs a LOD"
what = "Parts whose triangles get too small on screen below some size, worked out from their size and triangle count. While Too dense for its size is off, parts too dense even at full screen are listed here too, at a size above 1."
why = "Tiny triangles make the GPU shade many pixels for nothing. A LOD that switches in below the listed screen size keeps them big enough."
how = "Add a LOD that switches in at the listed screen size. The Opt workspace can generate one. Above 1, no LOD can help: reduce the mesh instead."

[rule.default]
enabled = true
severity = "info"

[[rule.param]]
key = "min_pixel_area"
kind = "number"
unit = "px²"
min = 0.25
max = 1024.0
default = 10.0
label = "Smallest triangle"
help = "How many pixels a triangle should cover on screen, on average. Smaller triangles are expensive for a GPU to draw."

[[rule.param]]
key = "screen_height"
kind = "count"
unit = "px"
min = 120
max = 8640
default = 1080
label = "Screen height"
help = "The height of the screen the game runs at, in pixels."

[[rule.param]]
key = "min_screen_size"
kind = "number"
min = 0.0
max = 4.0
default = 0.1
label = "Smallest screen size"
help = "Parts that would only need a LOD below this screen size are not reported."

[rule.app]
element = "node"
marker = "object"
view = "triangle_density"
see_also = "quad_overdraw"

[[rule]]
id = "density.triangle_reduce"
category = "density"
since = "0.9.0"
title = "Too dense for its size"
what = "Parts whose triangles are too small on screen even when the part fills the screen."
why = "A LOD cannot help, because the full-detail mesh is already too dense. It costs draw time and memory for detail no one can see."
how = "Reduce the mesh, or move the fine detail into a normal map. The Opt workspace can reduce it."

[rule.default]
enabled = true
severity = "warning"
[rule.base.generic]
severity = "info"

[rule.app]
element = "node"
marker = "object"
view = "triangle_density"
see_also = "quad_overdraw"

[[rule]]
id = "naming.invalid_characters"
category = "naming"
since = "0.9.0"
title = "Unsafe characters in names"
what = "Names with spaces, accents or symbols."
why = "Engines, file systems and scripts handle them differently; some rename the object on import and break references to it."
how = "Use only letters, digits, underscores, dashes and dots."

[rule.default]
enabled = true
severity = "info"
[rule.base.unreal]
severity = "warning"

[rule.app]
element = "node"
marker = "object"
view = "issues"

[[rule]]
id = "naming.pattern"
category = "naming"
since = "0.9.0"
name = "NamePattern"
title = "Naming convention"
what = "Names that do not match the profile's patterns for their kind of object."
why = "A shared naming convention is how a team and its tools find assets."
how = "Rename the object to match."

[rule.default]
enabled = false
severity = "info"

[[rule.param]]
key = "mesh"
kind = "patterns"
default = []
label = "Static meshes"
help = "Name patterns a static mesh must match. Leave empty for no rule."

[[rule.param]]
key = "skinned"
kind = "patterns"
default = []
label = "Skinned meshes"
help = "Name patterns a skinned mesh must match. Leave empty for no rule."

[[rule.param]]
key = "bone"
kind = "patterns"
default = []
label = "Bones"
help = "Name patterns a bone must match. Leave empty for no rule."

[[rule.param]]
key = "empty"
kind = "patterns"
default = []
label = "Empties"
help = "Name patterns an empty must match. Leave empty for no rule."

[[rule.param]]
key = "light"
kind = "patterns"
default = []
label = "Lights"
help = "Name patterns a light must match. Leave empty for no rule."

[[rule.param]]
key = "camera"
kind = "patterns"
default = []
label = "Cameras"
help = "Name patterns a camera must match. Leave empty for no rule."

[rule.app]
element = "node"
marker = "object"
view = "issues"

[[rule]]
id = "naming.lod_suffix"
category = "naming"
since = "0.9.0"
title = "LOD names"
what = "_LOD chains with a missing level, no LOD0, two parts for one level, or the base name beside its own LODs."
why = "Engines build LOD groups from these names on import; a broken chain imports the wrong levels or none."
how = "Number the levels from _LOD0 up with no gaps, one part per level."

[rule.default]
enabled = true
severity = "warning"
[rule.base.unity]
why = "Unity builds a LOD group from these names on import; a broken chain imports the wrong levels or none."
[rule.base.unreal]
why = "Unreal builds a LOD group from these names on import; a broken chain imports the wrong levels or none."
[rule.base.generic]
severity = "info"

[rule.app]
element = "node"
marker = "object"
view = "issues"

[[rule]]
id = "naming.collision_prefix"
category = "naming"
since = "0.9.0"
title = "Orphaned collision"
what = "Collision meshes whose name does not point at a render mesh."
why = "Collision is attached to the mesh its name points at; one that points nowhere is dropped."
how = "Rename the collision mesh after its render mesh, as UCX_<mesh>_01."

[rule.default]
enabled = true
severity = "info"
[rule.base.unreal]
severity = "error"
why = "Unreal attaches UCX_ collision to the mesh it names and drops one that names nothing, so the asset has no collision."

[[rule.param]]
key = "prefixes"
kind = "patterns"
default = ["UCX_*", "UBX_*", "USP_*", "UCP_*"]
label = "Collision prefixes"
help = "Name patterns that mark a collision mesh. The rest of the name must be a render mesh's name."

[rule.app]
element = "node"
marker = "object"
view = "issues"

[[rule]]
id = "naming.asset_prefix"
category = "naming"
since = "0.9.0"
title = "Asset prefix"
what = "Top-level assets whose name lacks the prefix for their kind."
why = "A type prefix lets assets sort and search by type."
how = "Rename the asset with the right prefix."

[rule.default]
enabled = false
severity = "info"
[rule.base.unreal]
enabled = true
severity = "warning"
why = "Unreal projects conventionally name static meshes SM_ and skeletal meshes SK_, so they sort and search by type."

[[rule.param]]
key = "static"
kind = "patterns"
default = ["SM_*"]
label = "Static assets"
help = "Name patterns a top-level static asset must match."

[[rule.param]]
key = "skinned"
kind = "patterns"
default = ["SK_*"]
label = "Skinned meshes"
help = "Name patterns a skinned mesh must match. Leave empty for no rule."

[rule.app]
element = "node"
marker = "object"
view = "issues"

[[rule]]
id = "hierarchy.empty_nodes"
category = "hierarchy"
since = "0.9.0"
title = "Empty groups"
what = "Empties with nothing that draws or bends below them."
why = "They add objects to the scene and to every transform update for nothing."
how = "Delete them, or rename them if they are sockets the engine needs."

[rule.default]
enabled = true
severity = "info"

[[rule.param]]
key = "ignore"
kind = "patterns"
default = ["SOCKET_*"]
label = "Ignore"
help = "Name patterns of empties that are there on purpose, such as sockets."

[rule.app]
element = "node"
marker = "dot"
view = "issues"

[[rule]]
id = "hierarchy.duplicate_names"
category = "hierarchy"
since = "0.9.0"
title = "Duplicate names"
what = "Objects that share a name."
why = "Engines and scripts find objects by name, so only one of them can be found; some importers rename the others."
how = "Give each object a unique name."

[rule.default]
enabled = true
severity = "warning"
[rule.base.generic]
severity = "info"

[rule.app]
element = "node"
marker = "object"
view = "issues"

[[rule]]
id = "hierarchy.multiple_roots"
category = "hierarchy"
since = "0.9.0"
title = "Several top-level objects"
what = "Files with more than one object at the top of the hierarchy."
why = "An engine may import them as separate assets, or under a root it adds itself."
how = "Parent everything under one root, unless the file is meant to hold several assets."

[rule.default]
enabled = true
severity = "info"

[rule.app]
element = "scene"
marker = "object"
view = "issues"

[[rule]]
id = "hierarchy.lights_cameras"
category = "hierarchy"
since = "0.9.0"
title = "Lights and cameras"
what = "Lights and cameras in the file."
why = "A model file usually should not carry them; they import as extra objects the scene has to manage."
how = "Delete them, or leave them out of the export selection."

[rule.default]
enabled = true
severity = "info"
[rule.base.unity]
severity = "warning"

[rule.app]
element = "node"
marker = "dot"
view = "issues"

[[rule]]
id = "hierarchy.materials_per_mesh"
category = "hierarchy"
since = "0.9.0"
title = "Materials per mesh"
what = "Parts using more materials than the profile allows."
why = "Each material on a part is a separate draw."
how = "Combine materials into an atlas, or split the part."

[rule.default]
enabled = true
severity = "warning"
[rule.base.generic]
severity = "info"

[[rule.param]]
key = "max"
kind = "count"
min = 1
max = 100000
default = 4
label = "Maximum"
help = "The largest value that still passes."

[rule.app]
element = "node"
marker = "object"
view = "issues"
