[workspace]
members = [
    "crates/app",
    "crates/import",
    "crates/l10n",
    "crates/l10n-build",
    "crates/model",
    "crates/optimize",
    "crates/prof",
    "crates/psd",
    "crates/render",
    "crates/shell-macos",
    "crates/ui",
]
# `vendor/sokol-rust` is a pinned upstream copy (`mac-port-plan.md` D21), not our code,
# but it sits inside the workspace directory and cargo makes any path dependency there a
# member automatically — which puts it under `cargo clippy --workspace -- -D warnings`
# and fails the lint on upstream's own style. Cargo only caps lints for crates it did not
# consider local, and `--exclude` on the command line does not change that; declaring it
# excluded here does. It still builds exactly as before, as a path dependency.
exclude = ["vendor/sokol-rust"]
resolver = "2"

# §3's review gate, in the manifest rather than only in a command line someone has
# to remember: `cargo clippy --workspace` now fails on a lint whether or not
# `-D warnings` was passed. Only clippy evaluates these, so a plain `cargo build`
# is unaffected. `priority = -1` lets an individual lint below override the group.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/psmyles/3d-review"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
cc = "1"
# The per-user config directory `window.cfg` lives in (`mac-port-plan.md` D17):
# `%APPDATA%` on Windows — the same path the hand-read `APPDATA` env var gave —
# and `~/Library/Application Support` on macOS, where that env var does not exist.
dirs = "6"
# egui renders through our own sokol_gfx renderer (`render/src/egui_sokol.rs`,
# `mac-port-plan.md` D3), which is what lifted the 0.33 ceiling egui-directx11
# 0.12.1 (`^0.33`) had pinned us to — that crate is gone (D6).
# `bytemuck` gives `epaint::Vertex` a `Pod` impl, so our egui renderer casts a
# tessellated mesh straight to bytes for the GPU with no `unsafe` of its own.
egui = { version = "0.36.1", features = ["bytemuck"] }
# The in-app manual renderer (invariant 12): the same markdown the mdBook site is
# built from, drawn with egui's own widgets. `load-images` is what installs
# egui_extras' `file` + `image` loaders, which resolve the shipped PNGs — the viewer
# does that itself on first show, so nothing here calls `install_image_loaders`.
# Everything else is off: the book has no code blocks to highlight
# (`better_syntax_highlighting` → syntect), no remote images (`fetch`), no SVG, and
# we build the page table ourselves rather than through its `macros`.
egui_commonmark = { version = "0.25", default-features = false, features = [
    "load-images",
    "pulldown_cmark",
] }
egui-winit = "0.36"
# Locale negotiation (`de-AT` → `de` → `en`) by BCP 47's own rules rather than a
# hand-rolled prefix match. Pinned to 0.13, which is the copy `fluent-bundle` already
# pulls — so this adds no crate to the graph at all. (0.14 is not an upgrade to reach
# for: it swapped `unic-langid` for `icu_locid`, whose `LanguageIdentifier` is a
# different type from the one `fluent-bundle` keys its bundles on.)
fluent-langneg = "0.13"
# The Fluent runtime behind invariant 12: plural/select rules and argument
# formatting we would otherwise hand-roll per language. `FluentBundle::new_concurrent`
# is what makes the process-wide catalog `Send + Sync`.
fluent-bundle = "0.16"
# The reference `.ftl` parser, used at *build* time to generate the typed keys and
# to check every locale against `en` — the same parser the runtime loads with, so
# "it built" means "it loads".
fluent-syntax = "0.12"
glam = "0.30"
half = "2"
image = { version = "0.25", default-features = false, features = [
    "png",
    "hdr",
    "tga",
    "tiff",
    "jpeg",
    "pnm",
] }
notify = "8"
# Build-script only: records where each manual page's images and intra-book links
# sit, so the runtime splices in resolved image paths without parsing markdown per
# frame. Pinned to the version `egui_commonmark` uses, so the graph holds one copy.
pulldown-cmark = { version = "0.13", default-features = false }
# The no-inline-strings gate (invariant 12) needs an AST, not a regex: a literal
# three lines into a wrapped call, or nested inside a `format!`, is exactly what it
# has to catch. Both are already in the graph via the serde/thiserror derives.
proc-macro2 = { version = "1", features = ["span-locations"] }
# The generated typed message keys, and the `tr`/`tr_args` they resolve through.
review-l10n = { path = "crates/l10n" }
# Build-dependency twin of `review-l10n`: turns the English catalog into a `keys.rs`
# in each consumer's OUT_DIR. Separate crate so a build script compiles only the
# `.ftl` parser, not the whole Fluent runtime.
review-l10n-build = { path = "crates/l10n-build" }
# The guarded Tracy zone/plot/message helpers, in one place: `tracy_client`'s own
# macros panic when no client is running, so every crate that instruments itself
# needs the same `Client::running()` guard around them.
review-prof = { path = "crates/prof" }
# Internal prebuilt-FFI crate: decodes layered PSD source art via psd_sdk (the
# only FFI site besides `crates/import` + the sanctioned D3D11 sites — invariant 9).
review-psd = { path = "crates/psd" }
rfd = "0.15"
# Build-script only: the shader-bytecode manifest keys freshness on content, and
# the packaging scripts on both OSes have to recompute the same digest from a
# shell (`Get-FileHash`, `shasum -a 256`). That portability is what picks SHA-256
# over something we could hand-roll in ten lines.
sha2 = "0.10"
# The shared GPU API the renderer is being ported onto (`mac-port-plan.md` D1/D21):
# sokol_gfx, over D3D11 on Windows and Metal on macOS. A pinned upstream checkout
# rather than a registry crate — the `sokol` name on crates.io is an unrelated 2019
# crate — and `exclude`d above so `-D warnings` does not lint it. See vendor/NOTICE.txt.
sokol = { path = "vendor/sokol-rust" }
# Derived on `review-optimize`'s operation-stack types only, so a stack can be
# saved/loaded as a JSON preset. Deliberately not a `review-model` dependency —
# that crate stays glam-only (invariant 10).
serde = "1"
serde_json = "1"
# The OS's own locale (`GetUserDefaultLocaleName` / `NSLocale`), so the viewer starts
# in the user's language with no platform code of ours.
sys-locale = "0.3"
# See `proc-macro2`: the no-inline-strings gate parses each source file rather than
# grepping it. Dev-dependency of `review-l10n` only.
syn = { version = "2", features = ["full", "visit"] }
thiserror = "2"
# Fluent's own locale identifier — what `fluent-bundle` keys a bundle on.
unic-langid = "0.9"
# zune is the fast decode path for JPEG textures (platform intrinsics + unsafe
# fast paths via `DecoderOptions::new_fast`). The `image` crate stays primary for
# PNG/TGA/TIFF/HDR (measured faster/correct there); PSD goes through `review-psd`.
zune-core = "0.5"
# Only the JPEG codec (+ SIMD fast paths) — default features pull in the whole zune
# codec tree (PNG/JXL/…) plus jxl-oxide, which we don't use (the `image` crate owns
# those formats here).
zune-image = { version = "0.5", default-features = false, features = ["jpeg", "simd"] }
# Tracy profiler client. Always compiled into the binary (incl. release) but
# runtime-gated: `manual-lifetime` means the client never auto-starts — `main`
# calls `Client::start()` only when `--tracy` is passed; `ondemand` means a
# started client buffers nothing until a Tracy server actually connects. Every
# zone/plot/message/alloc hook no-ops when the client isn't running, so a normal
# run pays ~nothing and opens no socket. (We deliberately never enable
# `profiling/profile-with-tracy`: that backend lowers third-party `profiling::scope!`
# calls to `tracy_client::span!`, which *panics* when no client is running — it would
# crash every non-`--tracy` launch. Our own D3D11 GPU + CPU zones cover the
# app/render structure instead.) See `Tracy profiling.md`.
tracy-client = { version = "0.18", features = ["manual-lifetime", "ondemand"] }
windows = "0.62.2"
windows-sys = "0.52"

# --- macOS platform leaf: the CAMetalLayer sokol_gfx draws through
# (`crates/render/src/rhi/backend/metal.rs`, invariant 9's sanctioned GPU site).
# Pinned to the versions winit 0.30 already pulls, so the mac build compiles no extra
# crates. `rfd` pulls a second, newer objc2 family; the two coexist because nothing
# passes objc2 types between them — this glue only hands sokol_gfx raw pointers.
# Their default feature is only `std`; every class is opt-in, so `render` names just
# the handful it needs and nothing else is generated.
objc2 = "0.5"
objc2-app-kit = "0.2"
objc2-foundation = "0.2"
objc2-metal = "0.2"
objc2-quartz-core = "0.2"
# The macOS menu bar (D15). A Mac app without one cannot even be quit — Cmd+Q is
# the menu's, not the window's.
muda = { version = "0.19", default-features = false }
winit = "0.30"
winresource = "0.1"

[profile.dev]
incremental = false

[profile.test]
incremental = false

# Optimized, self-contained build for distribution. `strip` and `panic = "abort"`
# drop debug symbols and the unwinding machinery a shipped viewer doesn't need;
# `lto` + single codegen unit trade build time for a faster, smaller binary. The
# console window is suppressed separately via `windows_subsystem` in `main.rs`.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
