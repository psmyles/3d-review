[workspace]
members = [
    "crates/app",
    "crates/import",
    "crates/model",
    "crates/render",
    "crates/ui",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chandan/3d-review-rs"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
cc = "1"
egui = "0.31"
egui-notify = "0.19"
egui-wgpu = "0.31"
egui-winit = "0.31"
glam = "0.30"
half = "2"
image = { version = "0.25", default-features = false, features = [
    "png",
    "hdr",
    "tga",
    "tiff",
    "jpeg",
    "pnm",
] }
notify = "8"
pollster = "0.4"
rfd = "0.15"
serde_json = "1"
thiserror = "2"
# Tracy profiler client. Always compiled into the binary (incl. release) but
# runtime-gated: `manual-lifetime` means the client never auto-starts — `main`
# calls `Client::start()` only when `--tracy` is passed; `ondemand` means a
# started client buffers nothing until a Tracy server actually connects. Every
# zone/plot/message/alloc hook no-ops when the client isn't running, so a normal
# run pays ~nothing and opens no socket. We deliberately do NOT enable
# `profiling/profile-with-tracy`: that backend lowers wgpu's/egui-wgpu's internal
# `profiling::scope!` calls to `tracy_client::span!`, which *panics* when no client
# is running — i.e. it would crash every non-`--tracy` launch. Our own zones cover
# the app/render structure instead. See `Tracy profiling.md`.
tracy-client = { version = "0.18", features = ["manual-lifetime", "ondemand"] }
wgpu = "24"
windows-sys = "0.52"
winit = "0.30"
winresource = "0.1"

[profile.dev]
incremental = false

[profile.test]
incremental = false

# Optimized, self-contained build for distribution. `strip` and `panic = "abort"`
# drop debug symbols and the unwinding machinery a shipped viewer doesn't need;
# `lto` + single codegen unit trade build time for a faster, smaller binary. The
# console window is suppressed separately via `windows_subsystem` in `main.rs`.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
